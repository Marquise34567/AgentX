<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentX</title>
<style>
  /* === X.com design system === */
  /* Pure black canvas, charcoal surfaces, X Blue accent */
  /* Matches X.com "Lights Out" dark mode exactly */
  :root {
    --canvas: #000000;
    --surface: #16181c;
    --surface-raised: #1d1f23;
    --surface-dark: #0f1419;
    --ink: #e7e9ea;
    --ink-soft: #cfd9de;
    --muted: #71767b;
    --muted-soft: #3d4145;
    --hairline: #2f3336;
    --hairline-soft: #1d1f23;
    --brand: #1d9bf0;
    --brand-hover: #1a8cd8;
    --brand-muted: rgba(29, 155, 240, 0.1);
    --green: #00ba7c;
    --red: #f4212e;
    --yellow: #ffd400;
    --pink: #f91880;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* === Header === */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--canvas);
    flex-shrink: 0;
  }
  .logo {
    width: 36px; height: 36px;
    border-radius: var(--radius);
    flex-shrink: 0;
  }
  .header-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .header-text h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--ink);
    line-height: 1.2;
  }
  .header-text .sub {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 400;
  }
  .header-text .sub .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green);
  }
  .header-settings {
    margin-left: auto;
    width: 28px; height: 28px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    background: var(--surface);
    cursor: pointer;
    display: grid; place-items: center;
    color: var(--muted);
    transition: all 0.15s;
  }
  .header-settings:hover {
    border-color: var(--brand);
    color: var(--brand);
  }

  /* === Chat area === */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }

  .date-sep {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    margin: 12px 0 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: var(--sans);
  }

  /* === Messages === */
  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 88%;
    margin-top: 6px;
  }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    position: relative;
    max-width: 100%;
  }

  /* User — X Blue */
  .bubble.user {
    background: var(--brand);
    color: #ffffff;
    border-radius: var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg);
  }

  /* Bot — charcoal card on black */
  .bubble.bot {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) var(--radius-sm);
  }

  .msg-row.consecutive { margin-top: 3px; }
  .msg-row.consecutive .bubble.user { border-radius: var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg); }
  .msg-row.consecutive .bubble.bot { border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) var(--radius-sm); }

  /* === Bot content === */
  .bubble.bot h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--ink);
    line-height: 1.3;
  }
  .bubble.bot p { margin: 8px 0; }
  .bubble.bot ul, .bubble.bot ol { margin: 8px 0 8px 18px; }
  .bubble.bot li { margin: 4px 0; }
  .bubble.bot strong { color: var(--ink); font-weight: 700; }
  .bubble.bot em { color: var(--muted); font-style: italic; }
  .bubble.bot code {
    font-family: var(--mono);
    background: var(--surface-raised);
    padding: 1px 5px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--brand);
  }
  .bubble.bot pre {
    background: var(--surface-dark);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 12px 14px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .bubble.bot pre code {
    background: none;
    color: var(--ink-soft);
    padding: 0;
    font-size: 13px;
    white-space: pre-wrap;
    font-family: var(--mono);
  }
  .code-block-wrap { position: relative; margin: 10px 0; }
  .code-block-wrap pre { margin: 0; padding-right: 110px; }
  .code-actions {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s;
  }
  .code-block-wrap:hover .code-actions { opacity: 1; }
  .copy-btn, .schedule-btn {
    background: var(--surface-raised);
    color: var(--ink-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    padding: 3px 10px;
    font-size: 11px;
    font-family: var(--mono);
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover, .schedule-btn:hover {
    background: var(--hairline);
    color: var(--ink);
  }
  .copy-btn.copied, .schedule-btn.copied {
    background: var(--brand);
    color: #fff;
    border-color: var(--brand);
  }
  .schedule-btn:disabled { opacity: 0.5; cursor: wait; }
  .sched-confirm {
    background: var(--brand-muted);
    border: 1px solid rgba(29,155,240,0.2);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  .bubble.bot blockquote {
    border-left: 3px solid var(--brand);
    padding: 4px 0 4px 12px;
    color: var(--muted);
    font-style: italic;
    margin: 8px 0;
  }
  .bubble.bot hr {
    border: none;
    border-top: 1px solid var(--hairline);
    margin: 12px 0;
  }

  /* User bubble content */
  .bubble.user strong { color: #fff; }
  .bubble.user code {
    font-family: var(--mono);
    background: rgba(255,255,255,0.15);
    padding: 1px 5px;
    border-radius: var(--radius-sm);
    font-size: 12px;
  }

  /* === Grade chips — X.com signal colors === */
  .grade-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 11px;
    margin-left: 4px;
    vertical-align: middle;
    font-family: var(--sans);
  }
  .grade-A\+ { background: rgba(0,186,124,.15); color: var(--green); }
  .grade-A { background: rgba(0,186,124,.15); color: var(--green); }
  .grade-B\+, .grade-B { background: rgba(29,155,240,.15); color: var(--brand); }
  .grade-C\+, .grade-C { background: rgba(255,212,0,.15); color: var(--yellow); }
  .grade-D, .grade-F { background: rgba(244,33,46,.15); color: var(--red); }

  /* === Typing indicator === */
  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.4s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

  /* === Composer === */
  footer {
    border-top: 1px solid var(--hairline);
    background: var(--canvas);
    padding: 12px 20px 20px;
    flex-shrink: 0;
  }
  .composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    padding: 10px 14px;
    resize: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.5;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer textarea:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px var(--brand-muted);
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send-btn {
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    width: 38px; height: 38px;
    display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0;
    transition: all .15s;
  }
  .send-btn:hover { background: var(--brand-hover); }
  .send-btn:active { transform: scale(.95); }
  .send-btn:disabled {
    background: var(--surface-raised);
    color: var(--muted);
    cursor: not-allowed;
  }
  .send-btn svg { width: 18px; height: 18px; }

  /* === Hint chips === */
  .hints {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .hint {
    font-size: 12px;
    color: var(--brand);
    background: var(--brand-muted);
    border: 1px solid rgba(29,155,240,0.2);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
    font-family: var(--sans);
  }
  .hint:hover {
    background: rgba(29,155,240,0.2);
    border-color: rgba(29,155,240,0.4);
  }

  /* === Settings panel === */
  .settings-panel {
    display: none;
    padding: 16px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
  }
  .settings-panel.open { display: block; }
  .settings-panel label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .settings-panel input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: var(--mono);
    color: var(--ink);
    background: var(--canvas);
    outline: none;
  }
  .settings-panel input:focus { border-color: var(--brand); }
  .settings-panel .hint-text {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Scrollbar */
  main::-webkit-scrollbar { width: 5px; }
  main::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Narrow sidepanel */
  @media (max-width: 420px) {
    header { padding: 12px 16px; }
    main { padding: 16px 16px 8px; }
    footer { padding: 10px 16px 16px; }
    .msg-row { max-width: 92%; }
    .bubble { font-size: 13.5px; }
    .header-text h1 { font-size: 16px; }
  }
</style>
</head>
<body>
  <header>
    <img class="logo" src="icons/icon128.png" alt="AgentX" />
    <div class="header-text">
      <h1>AgentX</h1>
      <div class="sub"><span class="dot"></span>engagement engine</div>
    </div>
    <button class="header-settings" id="settings-toggle" aria-label="Settings" title="Settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div class="settings-panel" id="settings-panel">
    <label for="api-url">API URL</label>
    <input type="text" id="api-url" placeholder="http://localhost:3000" />
    <div class="hint-text">Point to your AgentX server (localhost or Railway URL)</div>
  </div>

  <main id="chat">
    <div class="date-sep">Today</div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Type a topic, idea, or tweet to grade…" rows="1"></textarea>
      <button class="send-btn" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="hints">
      <span class="hint" data-text="autoeditor">autoeditor</span>
      <span class="hint" data-text="I just started my SaaS">SaaS post</span>
      <span class="hint" data-text="score: I spent 18 months building features nobody asked for. Then I deleted 80% of my product. MRR went up 3x.">Score a post</span>
      <span class="hint" data-text="help">Help</span>
    </div>
  </footer>

<script>
"use strict";

// === API URL — configurable via settings, defaults to localhost ===
let API_URL = "http://localhost:3000";

// Load saved URL from chrome.storage
if (typeof chrome !== "undefined" && chrome.storage) {
  chrome.storage.local.get("apiUrl", (result) => {
    if (result.apiUrl) {
      API_URL = result.apiUrl;
      document.getElementById("api-url").value = result.apiUrl;
    }
  });
}

// Settings toggle
const settingsToggle = document.getElementById("settings-toggle");
const settingsPanel = document.getElementById("settings-panel");
const apiUrlInput = document.getElementById("api-url");

settingsToggle.addEventListener("click", () => {
  settingsPanel.classList.toggle("open");
});

apiUrlInput.addEventListener("change", () => {
  API_URL = apiUrlInput.value.trim().replace(/\/$/, "") || "http://localhost:3000";
  if (typeof chrome !== "undefined" && chrome.storage) {
    chrome.storage.local.set({ apiUrl: API_URL });
  }
});

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let lastSender = null;

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  const codeBlocks = [];
  md = md.replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/\n$/, ""));
    return `\x00CB${codeBlocks.length - 1}\x00`;
  });

  let html = escapeHtml(md);

  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
  html = html.replace(/^---$/gm, "<hr>");
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(?<!\w)\*([^*\n]+?)\*(?!\w)/g, "<em>$1</em>");
  html = html.replace(/`([^`\n]+?)`/g, (m, c) => `<code>${c}</code>`);

  html = html.replace(/(?:^|\n)((?:- .+(?:\n|$))+)/g, (block, items) => {
    const lis = items.trim().split("\n").map((l) => `<li>${l.replace(/^- /, "")}</li>`).join("");
    return `\n<ul>${lis}</ul>`;
  });

  html = html.split(/\n{2,}/).map((chunk) => {
    if (/^\s*<(h3|ul|ol|blockquote|hr|pre)/.test(chunk)) return chunk;
    if (!chunk.trim()) return "";
    return `<p>${chunk.replace(/\n/g, "<br>")}</p>`;
  }).join("\n");

  html = html.replace(/\x00CB(\d+)\x00/g, (_, i) => {
    const code = escapeHtml(codeBlocks[+i]);
    const id = `code-${Date.now()}-${i}`;
    return `<div class="code-block-wrap"><pre id="${id}"><code>${code}</code></pre><div class="code-actions"><button class="copy-btn" onclick="copyCode('${id}', this)">copy</button><button class="schedule-btn" onclick="schedulePost('${id}', this)">schedule</button></div></div>`;
  });
  return html;
}

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function copyCode(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1500);
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    btn.textContent = "copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1500);
  });
}

function schedulePost(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.textContent.trim();
  if (!text) return;
  btn.textContent = "scheduling...";
  btn.disabled = true;
  fetch(`${API_URL}/api/postiz/schedule`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: text, platform: "x" }),
  })
    .then((r) => r.json())
    .then((data) => {
      if (data.error) {
        btn.textContent = "error";
        setTimeout(() => { btn.textContent = "schedule"; btn.disabled = false; }, 2000);
        return;
      }
      if (data.scheduled) {
        btn.textContent = "posted ✓";
        btn.classList.add("copied");
        addMessage("assistant", `<div class="sched-confirm"><strong>Scheduled via Postiz ✓</strong><br>${escapeHtml(text)}<br><br><em>Time: ${data.scheduledAt}</em><br><em>Account: @${data.integration?.profile || "x"} (${data.integration?.platform || "x"})</em></div>`);
      } else {
        btn.textContent = "dry run ✓";
        btn.classList.add("copied");
        const time = data.scheduledLabel || "next best slot";
        const reason = data.reason === "no POSTIZ_API_KEY set"
          ? "Set <code>POSTIZ_API_KEY</code> env var to actually schedule."
          : escapeHtml(data.reason || "");
        addMessage("assistant", `<div class="sched-confirm"><strong>Dry run — not scheduled</strong><br>${escapeHtml(text)}<br><br><em>Would post at: ${time}</em><br><small>${reason}</small></div>`);
      }
      scrollBottom();
      setTimeout(() => { btn.textContent = "schedule"; btn.disabled = false; btn.classList.remove("copied"); }, 2500);
    })
    .catch(() => {
      btn.textContent = "error";
      setTimeout(() => { btn.textContent = "schedule"; btn.disabled = false; }, 2000);
    });
}

function addMessage(role, contentHtml) {
  const wrap = document.createElement("div");
  wrap.className = "msg-row " + role;
  if (lastSender === role) wrap.classList.add("consecutive");
  lastSender = role;
  const bub = document.createElement("div");
  bub.className = "bubble " + role;
  bub.innerHTML = contentHtml;
  wrap.appendChild(bub);
  chat.appendChild(wrap);
  scrollBottom();
  return bub;
}

function addTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg-row bot";
  wrap.id = "typing-msg";
  wrap.innerHTML = '<div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(wrap);
  scrollBottom();
}
function removeTyping() {
  const t = document.getElementById("typing-msg");
  if (t) t.remove();
}

const WELCOME = `### AgentX

I generate and grade X posts on the real 2026 algorithm.

**What I can do:**
- **Generate tweets** — paste any topic or idea and I'll create 5 variations
- **Grade & rewrite** — paste a tweet and I'll score it + improve it
- **Outreach posts** — describe a deal or offer and I'll generate posts that attract your audience

Try a topic below or paste a tweet to grade.`;

setTimeout(() => { addMessage("bot", renderMarkdown(WELCOME)); }, 300);

async function send(text) {
  if (!text.trim()) return;
  addMessage("user", escapeHtml(text).replace(/\n/g, "<br>"));
  input.value = "";
  autoGrow();
  sendBtn.disabled = true;
  addTyping();
  try {
    const res = await fetch(`${API_URL}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    removeTyping();
    const md = (data.reply && data.reply.markdown) || "_(no reply)_";
    addMessage("bot", renderMarkdown(md));
  } catch (e) {
    removeTyping();
    addMessage("bot", `<p><strong>Connection error.</strong> Make sure your AgentX server is running at <code>${escapeHtml(API_URL)}</code></p><p>Click the settings icon to change the API URL.</p>`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(120, input.scrollHeight) + "px";
}

sendBtn.addEventListener("click", () => send(input.value));
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send(input.value);
  }
});

document.querySelectorAll(".hint").forEach((h) => {
  h.addEventListener("click", () => {
    input.value = h.dataset.text;
    autoGrow();
    send(h.dataset.text);
  });
});

input.focus();
</script>
</body>
</html>
