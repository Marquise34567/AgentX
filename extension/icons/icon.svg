<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="50%" stop-color="#c9642a"/>
      <stop offset="100%" stop-color="#a0481a"/>
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a87c"/>
      <stop offset="50%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#b85a3a"/>
    </linearGradient>
  </defs>
  <!-- Background circle with subtle gradient -->
  <circle cx="64" cy="64" r="62" fill="#faf9f5" stroke="url(#grad)" stroke-width="2"/>
  <!-- Curvy X — two interlocking organic strokes forming a knot/blossom -->
  <!-- Stroke 1: top-left to bottom-right, curvy -->
  <path d="M 38 36 C 48 46, 56 54, 64 64 C 72 74, 80 82, 90 92"
        fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Stroke 2: top-right to bottom-left, curvy -->
  <path d="M 90 36 C 80 46, 72 54, 64 64 C 56 74, 48 82, 38 92"
        fill="none" stroke="url(#grad2)" stroke-width="14" stroke-linecap="round"/>
  <!-- Center accent dot -->
  <circle cx="64" cy="64" r="6" fill="#faf9f5"/>
  <circle cx="64" cy="64" r="3" fill="url(#grad)"/>
</svg>
